<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — RUSH GRAFIKZ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--teal:#14746F;--coral:#FF8A5B;--text:#1F2A2A;--muted:#5C6B6B;--border:#ECEAE4;--surface:#F4F1EC;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;overflow-x:clip;}
body{font-family:'Inter',sans-serif;background:#FFFFFF;color:var(--text);}

/* ---- shared header (same as index.html) ---- */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);}
nav{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px 16px;padding:12px clamp(16px,5vw,64px);}
nav .logo{justify-self:start;}
.navtools{display:flex;align-items:center;gap:clamp(10px,1.6vw,18px);justify-self:end;}
@media (max-width:900px){nav{grid-template-columns:auto minmax(0,1fr);}.navlinks{grid-column:1 / -1;grid-row:2;justify-content:center;}nav .navtools{justify-self:stretch;justify-content:flex-end;min-width:0;}nav .searchbox{flex:0 1 200px;min-width:0;}nav .searchbox input{width:100%;min-width:0;}}
@media (max-width:520px){nav .logo{height:36px;}nav .navtools{gap:8px;}}
.logo{height:clamp(44px,6vw,64px);width:auto;display:block;cursor:pointer;}
.navlinks{display:flex;gap:clamp(14px,2.2vw,28px);align-items:center;justify-content:center;font-size:clamp(13px,1.4vw,15px);flex-wrap:wrap;}
.navlinks a{color:var(--text);text-decoration:none;white-space:nowrap;padding-bottom:2px;border-bottom:2px solid transparent;}
.cartbtn{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 13px;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:7px;text-decoration:none;}
.searchbox{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 4px 4px 12px;gap:4px;}
.searchbox input{border:none;background:transparent;outline:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--text);width:clamp(90px,14vw,160px);}
.searchbox input::placeholder{color:#A9A49A;}
.search-btn{background:var(--teal);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cartcount{background:var(--coral);color:#4A1B0C;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ---- checkout page head ---- */
.co-head{text-align:center;padding:clamp(28px,5vw,44px) clamp(16px,5vw,64px) 4px;}
.co-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:clamp(26px,4vw,34px);}
.co-title .rg{color:var(--teal);}
.co-title .accent{color:var(--coral);font-style:italic;}
.co-wrap{max-width:720px;margin:0 auto;padding:12px clamp(16px,5vw,64px) 60px;}
iframe{border:none;width:100%;display:block;}
</style></head>
<body>

<header>
<nav>
  <img class="logo" src="assets/images/img-1d8311ff5c.png" alt="Rush Grafikz — RG Crafts & Print Services" style="cursor:pointer;" onclick="location.href='index.html'">
  <div class="navlinks">
    <a href="index.html#home">Home</a>
    <a href="index.html#physical">Shop</a>
    <a href="index.html#digital">Digital</a>
    <a href="index.html#about">About</a>
    <a href="index.html#reviews">Reviews</a>
  </div>
  <div class="navtools">
    <div class="searchbox">
      <input type="text" id="searchInput" placeholder="Search products..." onkeydown="if(event.key==='Enter'){runSearch();}">
      <button class="search-btn" onclick="runSearch()" aria-label="Search">&#128269;</button>
    </div>
    <a class="cartbtn" href="index.html?openCart=1">Cart <span class="cartcount" id="cartcount">0</span></a>
  </div>
</nav>
</header>

<div class="co-head">
  <div class="co-title"><span class="rg">RG</span> <span class="accent">Checkout</span></div>
</div>

<div class="co-wrap">
  <iframe id="tallyFrame" data-tally-src="" loading="lazy" height="700" title="RG Checkout"></iframe>
</div>

<script>
(function(){
  var qs = window.location.search || '';
  var base = 'https://tally.so/embed/VL2MYy?hideTitle=1&transparentBackground=1&dynamicHeight=1';
  var url = qs ? (base + '&' + qs.slice(1)) : base;
  document.getElementById('tallyFrame').setAttribute('data-tally-src', url);
})();

// Cart count mirrors the same localStorage the main site uses
try{
  var saved = JSON.parse(localStorage.getItem('rg_cart') || '[]');
  document.getElementById('cartcount').textContent = Array.isArray(saved) ? saved.length : 0;
}catch(e){}

// Search here just hands off to the main site, which has the product grid
function runSearch(){
  var q = document.getElementById('searchInput').value.trim();
  if(q){ location.href = 'index.html?q=' + encodeURIComponent(q); }
}
</script>
<script src="https://tally.so/widgets/embed.js"></script>

</body></html>
